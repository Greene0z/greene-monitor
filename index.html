<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greene Monitor</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="center"><section class="card auth"><h1>Greene</h1><p>Monitor pessoal</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="login">Entrar</button><button id="signup" class="light">Criar conta</button><small id="msg"></small></section></div>
