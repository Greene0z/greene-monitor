<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Greene — Monitor Pessoal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth" class="auth-wrap">
    <section class="auth-card">
      <div class="logo">G</div>
      <h1>Greene</h1>
      <p>Seu painel pessoal de acompanhamento.</p>
      <form id="authForm">
        <label>E-mail<input id="email" type="email" required autocomplete="email"></label>
        <label>Senha<input id="password" type="password" minlength="6" required autocomplete="current-password"></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <button id="signupBtn" class="secondary">Criar conta</button>
      <p id="authMsg" class="msg"></p>
    </section>
  </div>

  <div id="shell" class="shell hidden">
    <aside>
      <div class="brand"><span>G</span><div><b>Greene</b><small>Monitor pessoal</small></div></div>
      <nav id="nav"></nav>
      <div class="aside-bottom">
        <button id="exportBtn" class="secondary">Exportar JSON</button>
        <button id="logoutBtn" class="secondary">Sair</button>
      </div>
    </aside>
    <main>
      <header><div><small id="dateLabel"></small><h1 id="title"></h1></div><button class="primary" data-go="daily">+ Registrar hoje</button></header>
      <div id="content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
